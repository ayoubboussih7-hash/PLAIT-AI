<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLANIT AI - Task Board</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-[#F5F3FF] text-slate-900 min-h-screen flex flex-col">

    <header class="bg-white border-b border-gray-300 rounded-lg">

        <nav class="flex flex-wrap items-center justify-around p-4 gap-5">

            <a href="index.html">
                <img class="w-50" src="./img/Logo PLANIT AI violet et indigo.png" alt="PLANIT AI">
            </a>

            <div class="flex gap-5">

                <a href="index.html" class="font-bold hover:text-[#7C3AED]">
                    Dashboard
                </a>

                <a href="new-project.html" class="font-bold hover:text-[#7C3AED]">
                    Nouveau projet
                </a>

            </div>

        </nav>

    </header>

    <main class="max-w-7xl w-full mx-auto p-6 flex-1">

        <a href="index.html" class="text-[#7C3AED] font-bold">
            &larr; Retour au Dashboard
        </a>

        <section class="bg-white rounded-xl shadow-sm p-6 my-6 border border-gray-200">

            <h1 id="project-name" class="text-3xl font-bold">
                Mon projet
            </h1>

            <p id="project-info" class="text-gray-500 mt-3"></p>

            <div class="flex justify-between mt-5">

                <p class="font-bold">Progression globale</p>

                <span id="progress-text" class="text-[#7C3AED] font-bold">
                    0%
                </span>

            </div>

            <div class="bg-violet-100 h-3 rounded-full mt-2">

                <div id="progress-bar" class="bg-[#7C3AED] h-3 rounded-full" style="width: 0%">
                </div>

            </div>

        </section>

        <h2 class="font-bold text-2xl mb-5">
            Task Board
        </h2>

        <section class="grid grid-cols-1 md:grid-cols-3 gap-5">

            <div class="bg-violet-100 rounded-xl p-4">

                <h2 class="text-violet-800 font-bold text-xl mb-5">
                    To Do
                </h2>

                <div id="todo" class="space-y-4"></div>

            </div>

            <div class="bg-amber-100 rounded-xl p-4">

                <h2 class="text-amber-800 font-bold text-xl mb-5">
                    In Progress
                </h2>

                <div id="inprogress" class="space-y-4"></div>

            </div>

            <div class="bg-green-100 rounded-xl p-4">

                <h2 class="text-green-800 font-bold text-xl mb-5">
                    Done
                </h2>

                <div id="done" class="space-y-4"></div>

            </div>

        </section>

    </main>

    <!-- Modal des tâches -->

    <div id="task-modal" class="hidden fixed inset-0 bg-black/50 items-center justify-center p-4 z-50">

        <div class="bg-white rounded-xl p-6 w-full max-w-xl max-h-[90vh] overflow-y-auto space-y-4">

            <div class="flex justify-between">

                <h2 id="task-id" class="text-xl font-bold text-[#7C3AED]">
                </h2>

                <button id="task-close" class="text-2xl font-bold">
                    &times;
                </button>

            </div>

            <label class="font-bold">Titre</label>

            <input id="task-title" class="border border-gray-300 rounded-lg p-2 w-full">

            <label class="font-bold">Description</label>

            <textarea id="task-description" class="border border-gray-300 rounded-lg p-2 w-full">
            </textarea>

            <div id="task-detail" class="text-sm text-gray-600 whitespace-pre-line">
            </div>

            <label class="font-bold">Priorité</label>

            <select id="task-priority" class="border rounded-lg p-2 w-full">

                <option>Low</option>
                <option>Medium</option>
                <option>High</option>
                <option>Critical</option>

            </select>

            <label class="font-bold">Taille</label>

            <select id="task-size" class="border rounded-lg p-2 w-full">

                <option>XS</option>
                <option>S</option>
                <option>M</option>
                <option>L</option>
                <option>XL</option>

            </select>

            <label class="font-bold">Deadline</label>

            <input id="task-deadline" class="border rounded-lg p-2 w-full">

            <label class="font-bold">Status</label>

            <select id="task-status" class="border rounded-lg p-2 w-full">

                <option>To Do</option>
                <option>In Progress</option>
                <option>Done</option>

            </select>

            <p id="task-error" class="text-red-600"></p>

            <div class="flex justify-between">

                <button id="task-delete" class="bg-red-100 text-red-600 rounded-lg px-4 py-2">
                    Supprimer
                </button>

                <button id="task-save" class="bg-[#7C3AED] text-white rounded-lg px-4 py-2">
                    Enregistrer
                </button>

            </div>

        </div>

    </div>

    <footer class="bg-white border-t p-6 flex flex-wrap justify-between">

        <div>
            <p class="font-bold text-[#7C3AED]">PLANIT AI</p>
            <p class="text-gray-500 text-sm">
                Planifiez intelligemment, développez efficacement
            </p>
        </div>

        <p class="text-gray-500 text-sm">
            © 2026 PLANIT AI. Tous droits réservés
        </p>

    </footer>

    <script type="module" src="./js/main.js"></script>

</body>

</html>
