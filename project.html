
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLANIT AI | Project Board</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="module" src="./js/main.js"></script>
</head>

<body class="min-h-screen bg-gray-950 text-white">

    <header class="bg-gray-900 border-b border-gray-800">
        <nav class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
            <a href="./index.html" class="text-2xl font-bold text-blue-400">
                PLANIT AI
            </a>

            <div class="flex gap-5 items-center">
                <a href="./index.html">Dashboard</a>
                <a href="./new-project.html">Nouveau projet</a>
                <button id="open-settings" class="text-blue-400">
                    Paramètres IA
                </button>
            </div>
        </nav>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-10">

        <a href="./index.html" class="text-blue-400 hover:underline">
            ← Retour au Dashboard
        </a>

        <section id="project-summary" class="my-10"></section>

        <div id="kanban-board"
             class="grid grid-cols-1 md:grid-cols-3 gap-6">
        </div>

    </main>

    <div id="settings-modal"
         class="hidden fixed inset-0 z-50 bg-black/80 items-center justify-center p-4">

        <div class="bg-gray-900 rounded-xl p-8 w-full max-w-lg space-y-5">
            <div class="flex justify-between items-center">
                <h2 class="text-2xl font-bold">Paramètres IA</h2>
                <button id="close-settings">✕</button>
            </div>

            <label class="block">
                <input type="radio" name="ai-mode" value="demo" checked>
                Mode Demo
            </label>

            <label class="block">
                <input type="radio" name="ai-mode" value="real">
                Mode Gemini
            </label>

            <div id="api-key-container" class="hidden">
                <label for="api-key">Clé API Gemini</label>
                <input id="api-key" type="password"
                       class="w-full bg-gray-800 rounded p-3 mt-2">
            </div>

            <button id="save-settings"
                    class="bg-blue-600 px-6 py-3 rounded-lg">
                Enregistrer
            </button>
        </div>
    </div>

</body>
</html>
